name: Build Wave Music APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir source
          unzip -q "$ZIP" -d source
          test -f source/WaveMusic/settings.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p source/WaveMusic assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveMusic-APK
          path: source/WaveMusic/app/build/outputs/apk/debug/app-debug.apk
